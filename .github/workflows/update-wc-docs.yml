name: Update WC Docs

on:
  repository_dispatch:
    types: [webcomponents-docs-published]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.JUSTIFI_MACHINA_GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v2
        with:
          version: 10.6.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # Reads docusaurus.config.ts only — no dependencies needed, so this runs
      # before the bump and tells the steps below which line is being replaced.
      - name: Compare incoming WC version to current label (docusaurus.config.ts)
        id: ver
        env:
          WC_VERSION: ${{ github.event.client_payload.webcomponents_version }}
        run: node scripts/wc-version-gate.mjs

      # .wc-current is generated from the installed @justifi/webcomponents-docs,
      # so the outgoing docs only exist on disk BEFORE the bump. Snapshot here, or
      # the archive ends up being a copy of the incoming docs and the line that is
      # being replaced is lost.
      - name: Install dependencies (outgoing docs)
        if: steps.ver.outputs.should_snapshot == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Snapshot outgoing docs line
        if: steps.ver.outputs.should_snapshot == 'true'
        env:
          CURRENT_LABEL: ${{ steps.ver.outputs.current_label }}
        run: |
          node scripts/sync-wc-docs.mjs
          pnpm docusaurus docs:version:web-components "$CURRENT_LABEL"

      - name: Bump JustiFi packages in package.json
        env:
          DOCS_VERSION: ${{ github.event.client_payload.docs_version }}
          WC_VERSION: ${{ github.event.client_payload.webcomponents_version }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies['@justifi/webcomponents-docs'] = process.env.DOCS_VERSION;
            const wc = (process.env.WC_VERSION || '').trim().replace(/^v/i, '');
            if (wc) pkg.dependencies['@justifi/webcomponents'] = wc;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync docs to .wc-current
        run: node scripts/sync-wc-docs.mjs

      - name: Update current label in docusaurus.config.ts
        if: steps.ver.outputs.should_snapshot == 'true'
        env:
          MAJOR_MINOR: ${{ steps.ver.outputs.major_minor }}
        run: node scripts/wc-set-current-label.mjs

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ secrets.JUSTIFI_MACHINA_GITHUB_TOKEN }}
          DOCS_VERSION: ${{ github.event.client_payload.docs_version }}
          WC_VERSION: ${{ github.event.client_payload.webcomponents_version }}
        run: |
          BRANCH="update-wc-docs-${DOCS_VERSION}"
          git config user.name "justifi-machina"
          git config user.email "machina@justifi.ai"
          git checkout -b "$BRANCH"
          git add .
          git commit -m "chore: update @justifi/webcomponents-docs to ${DOCS_VERSION}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: update @justifi/webcomponents-docs to ${DOCS_VERSION}" \
            --body "Triggered by @justifi/webcomponents v${WC_VERSION} release." \
            --base main
