name: Deploy to GitHub Pages

# Deploys the Docusaurus site to GitHub Pages.
#
# Serves at the custom domain https://docs.justifi.tech/ (Step 2 cutover).
# The domain is pinned by static/CNAME; SITE_BASE_URL is '/' because the site
# is served at the domain root (no project-page path prefix).
#
# NOTE: merging this triggers the cutover. The old staging URL
# https://justifi-tech.github.io/public-docs/ will break once baseUrl is '/'.
# Do not merge until DNS for docs.justifi.tech is ready to point at Pages.

on:
  # Manual trigger so we control when the trial site publishes.
  workflow_dispatch:
  # Auto-publish on merges to main. Remove this block if you prefer
  # manual-only deploys while Vercel remains the production site.
  push:
    branches:
      - main

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish (don't cancel).
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://docs.justifi.tech
      SITE_BASE_URL: /
    steps:
      - uses: actions/checkout@v4

      # Version is read from the "packageManager" field in package.json.
      # Do not set `version` here as well, or action-setup errors on the mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
