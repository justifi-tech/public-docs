type: object
properties:
  id:
    description: unique checkout completion id
    type: string
    example: chc_xyz123
  payment_mode:
    type: string
    example: ecom
    enum: [ecom, bnpl, card_present, paypal, venmo]
  payment_token:
    type: string
    example: pm_xyz123
    description: the payment method token used to process the payment for ecom payments. For `paypal` and `venmo`, the id of the PayPal order the customer approved (`ppo_...`)
  status:
    type: string
    enum: [succeeded, failed, processing, pending]
    example: succeeded
    description: the status of the completion. `pending` applies to `paypal` and `venmo` only, while PayPal has not yet confirmed the capture
  payment_status:
    type: string
    enum: [succeeded, failed, pending, canceled, skipped]
    example: succeeded
    description: depending upon payment mode, the status of the payment API call, bnpl transaction, card reader transaction, or PayPal capture.
  payment_error_code:
    type: string
    example: card_declined
    description: when payment fails, related error code
  payment_error_description:
    type: string
    example: Your card was declined
    description: when payment fails, related error description
  payment_response:
    allOf:
    - type: object
    - description: payment object if completion attempt was successful, error object if not successful. For `paypal` and `venmo`, the capture details returned by PayPal, or PayPal's error details. It is not a payment object.
    - $ref: ./CardPaymentWithEnvelope.yaml
  checkout_id:
    type: string
    format: uuid
    example: cho_xyz123
    description: id of the checkout for this completion
  additional_transactions:
    type: array of objects
    description: legacy attribute, any other transactions processed during checkout completion. For example, insurance payments
    example: []
  payment_id:
    type: string
    format: uuid
    example: 'py_xyz123'
    description: id of the payment associated with this checkout, when successful. Always null for `bnpl`, `paypal` and `venmo`, which do not create a JustiFi payment
  payment_method_id:
    type: string
    format: uuid
    example: 'pm_xyz123'
    description: id of the payment method associated with this checkout, when successful
  terminal_id:
    type: string
    format: uuid
    example: 'trm_xyz123'
    description: id of the terminal used for this checkout, when mode is card present
  created_at:
    type: string
    format: date-time
    example: '2024-01-01T12:00:00Z'
  updated_at:
    type: string
    format: date-time
    example: '2024-01-01T12:00:00Z'
