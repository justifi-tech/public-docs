type: object
properties:
  id:
    description: unique dispute id
    type: string
    example: dp_xyz
  payment_id:
    description: the disputed payment
    type: string
    format: uuid
    example: py_xyz
  account_id:
    description: id of the account associated with the dispute
    type: string
    format: uuid
    example: acc_xyz
  amount:
    description: amount disputed in cents
    type: number
    example: 100
  currency:
    type: string
    enum: [usd, cad]
    example: usd
  reason:
    type: string
    description: the reason this payment was disputed
    example: fraudulent
  due_date:
    type: string
    format: date
    description: due date for evidence submission to counter the dispute
    example: '2025-02-23'
  status:
    description: status of the dispute
    type: string
    example: won
    enum: [needs_response, under_review, won, lost]
  metadata:
    type: object
    format: json
    description: any useful information you'd like to store alongside this dispute
    example: {}
  funds_held_until:
    type: string
    format: date-time
    nullable: true
    description: end of the issuer appeal window. the disputed amount is held to this date after the card network ruled for the merchant, and until the appeal is decided if the issuer appeals. null otherwise, including once the dispute is won or lost
    example: '2026-01-09T16:20:27Z'
  pre_arbitration:
    type: boolean
    description: true once the cardholder's issuer has appealed a dispute that the card network ruled for the merchant
    example: false
  pre_arbitration_received_at:
    type: string
    format: date-time
    nullable: true
    description: when the issuer appeal arrived
    example: '2025-12-01T15:00:00Z'
  pre_arbitration_due_date:
    type: string
    format: date
    nullable: true
    description: deadline for the merchant to contest the issuer appeal
    example: '2025-12-15'
  created_at:
    type: string
    format: date-time
    example: '2021-01-01T12:00:00Z'
  updated_at:
    type: string
    format: date-time
    example: '2021-01-01T12:00:00Z'
  dispute_response: 
    allOf:
      - type: object
      - description: present when evidence was submitted to counter dispute
      - $ref: ./DisputeResponse.yaml
      - nullable: true
  dispute_reversal:
    type: object
    description: present when dispute gets reversed from lost to won
    properties:
      description:
        type: string
        example: Dispute was reversed
      created_at:
        type: string
        format: date-time
        example: '2021-01-01T12:00:00Z'
    nullable: true
