type: object
properties:
  id:
    description: unique id of the payment method
    type: string
    example: pm_123xyz
  status:
    description: signals whether the payment method is valid or invalid
    type: string
    example: "valid"
  invalid_reason:
    description: informs reason that the payment method has been marked invalid, if status is invalid 
    type: string
    example: nil
    nullable: true
  created_at:
    type: string
    format: date-time
    example: '2024-01-01T12:00:00Z'
  updated_at:
    type: string
    format: date-time
    example: '2024-01-01T12:00:00Z'
  card:
    $ref: ./CardWithBinDetails.yaml
  customer_id:
    description: id of the customer associated with the payment method
    type: string
    example: "cust_xyz"
    nullable: true
  signature:
    description: signature that uniquely identifies a credit card or bank account across payment methods
    type: string
    example: "4guAJNkVA3lRLVlanNVoBK"
    nullable: true
  account_id:
    description: account id associated with payment method
    type: string
    example: "acc_123"
    nullable: true
