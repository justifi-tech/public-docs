type: object
properties:
  id:
    description: unique bank account id
    type: string
    format: uuid
    example: ba_123xyz
  account_owner_name:
    description: name of the account owner
    type: string
    example: Napheesa Collier
  account_type:
    description: type of the account
    type: string
    enum: [checking, savings]
    example: checking
  account_number_last4:
    description: last 4 digits of the account number
    type: string
    example: "6789"
  routing_number:
    description: routing number for account (US bank accounts)
    type: string
    nullable: true
    example: "110000000"
  institution_number:
    description: 3-digit institution number identifying the bank (Canadian bank accounts only)
    type: string
    nullable: true
    example: null
  transit_number:
    description: 5-digit transit number identifying the bank branch (Canadian bank accounts only)
    type: string
    nullable: true
    example: null
  bank_name:
    description: name of the bank
    type: string
    example: Wells Fargo
  country:
    description: country for the bank account. Bank accounts created with the create bank account endpoint take the business's country_of_establishment (USA or CAN); bank accounts added another way, such as through Plaid, return US
    type: string
    enum: [USA, CAN, US, CA]
    example: USA
  currency:
    description: currency for the bank account
    type: string
    enum: [usd, cad]
  nickname:
    description: nickname for the bank account
    type: string
    example: Phee's money
  metadata:
    type: object
    format: json
    description: any useful information you'd like to store alongside this bank account
    example: {}
  verified:
    description: whether the bank account has been verified by a third-party provider
    type: boolean
    example: false
  verification_provider:
    description: the provider that verified the bank account, when verified
    type: string
    enum: [plaid]
    nullable: true
    example: null
  business_id:
    type: string
    format: uuid
    example: biz_123abc
  platform_account_id:
    type: string
    format: uuid
    example: acc_123abc
  created_at:
    type: string
    format: date-time
    example: "2021-01-01T12:00:00Z"
  updated_at:
    type: string
    format: date-time
    example: "2021-01-01T12:00:00Z"
