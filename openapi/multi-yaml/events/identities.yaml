post:
  description: |
    Received for the following events: identity.created, identity.updated

    Identities are the representative and owners of a business. `identity.created` is published when
    an identity is created, and `identity.updated` when it is updated.
  tags:
    - Events
  operationId: identityEvent
  summary: Identities
  requestBody:
    content:
      application/json:
        schema:
          allOf:
            - $ref: ../components/schemas/Event.yaml
            - properties:
                data:
                  $ref: ../components/schemas/IdentityResponse.yaml
        example:
        examples:
          "Identity_created_event":
            value:
              id: evt_123xyz
              account_id: acc_987zyx
              account_type: test
              platform_account_id: acc_987zyx
              idempotency_key: string
              request_id: req_123
              version: v1
              data:
                id: idty_123xyz
                platform_account_id: acc_987zyx
                business_id: biz_123xyz
                name: Person Name
                title: President
                email: person.name@justifi.ai
                phone: "6124011111"
                dob_day: "01"
                dob_month: "01"
                dob_year: "1980"
                ssn_last4: "6789"
                is_owner: true
                ownership_percentage: 25
                metadata: {}
                address:
                  id: addr_123xyz
                  platform_account_id: acc_987zyx
                  line1: 123 Example St
                  line2: Suite 101
                  postal_code: "55555"
                  city: Minneapolis
                  state: MN
                  country: USA
                  created_at: "2021-01-01T12:00:00Z"
                  updated_at: "2021-01-01T12:00:00Z"
                documents: []
                created_at: "2021-01-01T12:00:00Z"
                updated_at: "2021-01-01T12:00:00Z"
              event_name: identity.created
  responses:
    "200":
      description: Return a 200 status to indicate that the data was received successfully. You must respond within 5 seconds.
