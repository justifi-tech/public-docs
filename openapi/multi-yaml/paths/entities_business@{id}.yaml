patch:
  summary: Update a Business
  description: |
    Update information about a Business

    The create and update business APIs do not validate that any specific properties are present, so a business can be created with partial information and completed later.
    However, when a business is provisioned for payments via the [Provisioning API](https://docs.justifi.tech/api-spec#tag/Provisioning/operation/ProductProvisioning), specific properties are required.
    These properties are marked as "Required when provisioning payments" in their descriptions below.
  operationId: UpdateBusiness
  tags:
    - Business
  parameters:
    - $ref: ../components/parameters/id-path.yaml
    - $ref: ../components/parameters/authorization-header.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          properties:
            archived:
              type: boolean
              example: true
              description: set to true to archive this business. Test mode businesses can always be archived. A live mode business can only be archived while it has not been provisioned; once a product has been provisioned for it, or a sub account is associated with it, archiving returns an error. Archiving frees the business's legal_name for reuse, so setting this back to false returns an error if another active business on your platform has taken that name in the meantime
            legal_name:
              type: string
              example: "Business Name"
              description: legal business entity name. Required when provisioning payments
            website_url:
              type: string
              example: "https://justifi.ai"
              description: website for this business (if they don't have a website, can send their social media business page, app store link, or a product description instead). Required when provisioning payments
            email:
              type: string
              example: "business@justifi.ai"
              description: email address of business entity or representative. Required when provisioning payments
            phone:
              type: string
              example: "6124011111"
              description: business phone number. Required when provisioning payments
            doing_business_as:
              type: string
              example: "Best Business"
              description: only needed if registered with DBA/Trade Name on SS-4 tax document
            business_type:
              type: string
              enum: [for_profit, non_profit, government_entity, individual]
              description: (deprecated) use classification instead - see [classification mapping table](https://docs.justifi.tech/api-spec#tag/Business)
            business_structure:
              type: string
              enum:
                [
                  sole_proprietorship,
                  single_llc,
                  multi_llc,
                  private_partnership,
                  private_corporation,
                  unincorporated_association,
                  public_partnership,
                  public_corporation,
                  incorporated,
                  unincorporated,
                  government_unit,
                  government_instrumentality,
                  tax_exempt_government_instrumentality,
                ]
              description: (deprecated) use classification instead - see [classification mapping table](https://docs.justifi.tech/api-spec#tag/Business)
            classification:
              type: string
              enum:
                [
                  government,
                  limited,
                  non_profit,
                  partnership,
                  corporation,
                  public_company,
                  sole_proprietor,
                ]
              description: simplified classification, use instead of business_type and business_structure - see [classification mapping table](https://docs.justifi.tech/api-spec#tag/Business). Required when provisioning payments
            industry:
              type: string
              example: "Big Business"
              description: to help us identify this business entity's category code (MCC), please provide a concise description of what service they offer. Required when provisioning payments
            mcc:
              type: string
              example: "8021"
              description: merchant category code for this business, if known. Please note, the JustiFi underwriting team may modify this. If you are unsure, just submit a description in the industry field instead of an MCC
            tax_id:
              type: string
              description: the federal tax identification number/EIN issued to this sub account by the IRS (for Individual type, this will be their full SSN), the value is saved but not returned in any API response. Required when provisioning payments (US businesses only)
            date_of_incorporation:
              type: string
              example: "2015-02-20"
              description: the specific day when this business was officially registered with a relevant government authority and was then permitted to carry out its activities. Required when provisioning payments
            metadata:
              type: object
              description: any useful information you'd like to store alongside this business
              additionalProperties: true
              example:
                arr: 1200
                social_network: "@business"
            additional_questions:
              description: "Required when provisioning payments: `business_revenue`, `business_payment_volume`, `business_average_transaction_amount` and `business_when_service_received`"
              allOf:
                - $ref: ../components/schemas/AdditionalQuestions.yaml
            legal_address:
              description: "Required when provisioning payments: `line1`, `city`, `state` and `postal_code`"
              oneOf:
                - $ref: ../components/schemas/Address.yaml
                - type: object
                  properties:
                    id:
                      type: string
                      example: addr_xyz
            representative:
              description: "Required when provisioning payments: `name`, `title`, `email`, `phone`, `dob_day`, `dob_month`, `dob_year`, `identification_number` (US businesses only) and `address` (`line1`, `city`, `state`, `postal_code`)"
              oneOf:
                - $ref: ../components/schemas/Identity.yaml
                - type: object
                  properties:
                    id:
                      type: string
                      example: idty_xyz
            owners:
              type: array
              description: up to four business owners total. Replaces the business's current list of owners, so include every owner the business should keep, referencing existing owners by id. To change an existing owner's details, use the update identity endpoint instead. Required when provisioning payments
              items:
                oneOf:
                  - $ref: ../components/schemas/Identity.yaml
                  - type: object
                    properties:
                      id:
                        type: string
                        example: idty_xyz

  responses:
    "200":
      description: Successfully update a business
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/Envelope.yaml
              - properties:
                  type:
                    example: business
                  data:
                    $ref: ../components/schemas/BusinessResponse.yaml

get:
  summary: Get a Business
  description: Get information about a Business
  operationId: GetBusiness
  tags:
    - Business
  parameters:
    - $ref: ../components/parameters/id-path.yaml
    - $ref: ../components/parameters/authorization-header.yaml

  responses:
    "200":
      description: Successfully get a business
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/Envelope.yaml
              - properties:
                  type:
                    example: business
                  data:
                    $ref: ../components/schemas/BusinessResponse.yaml
