get:
  summary: List Terminals
  operationId: listTerminals
  tags:
    - Terminals
  parameters:
    - $ref: ../components/parameters/authorization-header.yaml
    - $ref: ../components/parameters/sub-account.yaml
    - $ref: ../components/parameters/created-before.yaml
    - $ref: ../components/parameters/created-after.yaml
    - in: query
      name: status
      schema:
        type: string
        enum: [connected, disconnected, unknown, pending_configuration, archived]
      required: false
      example: "connected"
      description: |
        filter records by the terminal status. Accepts multiple comma separated status values.
    - in: query
      name: terminal_id
      schema:
        type: string
      required: false
      example: "trm_abc123"
      description: |
        filter records by terminal id
    - in: query
      name: provider
      schema:
        type: string
        enum: [verifone, verifone_simulator]
      required: false
      example: "verifone"
      description: |
        filter records by the terminal provider. Accepts multiple comma separated provider values.
    - in: query
      name: provider_id
      schema:
        type: string
      required: false
      example: "23456789"
      description: |
        filter records by provider id, also called device id (DID). Accepts multiple comma separated provider ids.
    - in: query
      name: serial_number
      schema:
        type: string
      required: false
      example: "888-222-444"
      description: |
        filter records by the terminal device serial number. Only populated after the device has been configured, so terminals awaiting configuration will not match.
    - in: query
      name: terminal_order_id
      schema:
        type: string
      required: false
      example: "tord_123xyz"
      description: |
        filter records by terminal order id
    - in: query
      name: verified_after
      schema:
        type: string
        format: date-time
      required: false
      example: "2024-01-01T00:00:00Z"
      description: |
        filter records which were verified after the date and time (UTC) specified. Dates without time specified will default to 00:00:00
    - in: query
      name: verified_before
      schema:
        type: string
        format: date-time
      required: false
      example: "2024-01-01T00:00:00Z"
      description: |
        filter records which were verified before the date and time (UTC) specified. Dates without time specified will default to 00:00:00
    - in: query
      name: verified_on
      schema:
        type: string
        format: date
      required: false
      example: "2024-01-01"
      description: |
        filter records which were verified on the date specified between 00:00:00 and 23:59:59 (UTC)
  responses:
    '200':
      description: Successfully list terminals
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/Envelope-list.yaml
              - properties:
                  type:
                    example: array
                  data:
                    items:
                      $ref: ../components/schemas/Terminal.yaml
