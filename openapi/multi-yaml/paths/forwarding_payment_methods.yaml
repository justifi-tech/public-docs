post:
  summary: Create a Forwarding Payment Method
  description: |
    Record a card so it has a payment method id that
    [Create a Forwarding Request](https://docs.justifi.tech/api-spec#tag/Forwarding/operation/CreateForwardingRequest)
    can use, without contacting a payment gateway or tokenizing the card for processing.

    **This endpoint requires prior approval.** It accepts a raw card number, so — exactly like
    [Create a Payment Method](https://docs.justifi.tech/api-spec#tag/Payment-Methods/operation/CreatePaymentMethod)
    — your platform must be approved to submit full card numbers, which requires at minimum a
    completed SAQ (Self-Assessment Questionnaire). Contact
    [JustiFi Customer Success](mailto:customer_success@justifi.tech) for approval. Without it the
    request is rejected with `full_pan_not_allowed`.

    *Note: only cards are accepted. A bank account, a card-present payment method or an existing
    payment method token is rejected. The `verification` value (CVV) is accepted but never stored and
    never forwarded. If the sub account status is not `enabled`, `400` will be returned.*
  operationId: CreateForwardingPaymentMethod
  tags:
    - Forwarding
  parameters:
    - $ref: ../components/parameters/idempotency-key-header.yaml
    - $ref: ../components/parameters/authorization-header.yaml
    - $ref: ../components/parameters/sub-account-required.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            payment_method:
              type: object
              properties:
                card:
                  $ref: ../components/schemas/CreateCard.yaml
              required: [card]
          required: [payment_method]
        example:
        examples:
          "Record_a_card_for_forwarding":
            summary: "Record a card for forwarding (requires SAQ approval)"
            description: "Requires prior approval and a completed SAQ (Self-Assessment Questionnaire)."
            value:
              payment_method:
                card:
                  name: Lindsay Whalen
                  number: "4242424242424242"
                  month: "5"
                  year: "2042"
                  address_postal_code: "55555"
                  metadata:
                    migrated_from: legacy_vault
  responses:
    "201":
      description: |
        The card was recorded. No gateway was contacted and no gateway token was created. The returned
        `pm_` id can be used as the `payment_method` on a forwarding request.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CardResponse.yaml
    "400":
      description: The request was rejected. Nothing was recorded.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/PaymentError.yaml
          examples:
            "Full_PAN_not_allowed":
              value:
                error:
                  code: full_pan_not_allowed
                  message: "Full card numbers are not accepted on this endpoint. Please use the tokenization iframe to create a payment method token first."
            "Card_number_invalid":
              value:
                error:
                  code: card_number_invalid
                  message: "Card number is invalid"
