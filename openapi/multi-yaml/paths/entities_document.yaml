post:
  summary: Create a Document
  description: |
    Create a reference to a document, and receive a presigned URL for uploading the document
  operationId: CreateDocument
  tags:
    - Document
  parameters:
    - $ref: ../components/parameters/authorization-header.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          properties:
            description:
              type: string
              example: "My Document"
            file_name:
              type: string
              example: "the_file_name"
            file_type:
              type: string
              example: "application/pdf"
              description: the file media type/extension of the file you are uploading. For example, text/plain,
                application/pdf, image/png
            document_type:
              type: string
              enum:
                - articles_of_incorporation
                - balance_sheet
                - bank_statement
                - birth_certificate
                - business_registration
                - citizenship_card
                - driver_license
                - foreign_passport
                - government_id
                - nexus_card
                - passport
                - profit_and_loss_statement
                - resident_card
                - sin_card
                - ssn_card
                - status_card
                - tax_return
                - voided_check
                - other
              example: "balance_sheet"
              description: |
                The kind of document being uploaded. To provision a business for payments, upload:

                - **Financial document** (all businesses): `voided_check` or `bank_statement`.
                - **Business document** (Canadian businesses only): `articles_of_incorporation` or `business_registration`.
                - **Owner identification** (Canadian businesses only): one Group 1 and one Group 2 ID per owner.
                  - Group 1: `passport` (Canadian passport), `driver_license` (Canadian or US state driver's license),
                    `government_id` (Canadian government-issued ID card), `resident_card` (Permanent Resident Card),
                    `status_card` (Certificate of Indian Status).
                  - Group 2: `nexus_card` (NEXUS card), `citizenship_card` (Canadian citizenship or naturalization card or
                    certificate), `foreign_passport`, `birth_certificate` (Canadian birth certificate), `sin_card` (Social
                    Insurance Number card), `ssn_card` (Social Security Number card).

                `balance_sheet`, `profit_and_loss_statement`, `tax_return` and `other` are optional.
            business_id:
              type: string
              format: uuid
              example: biz_abc123
              description: the business id to associate with this document (one of business id or identity id is required)
            identity_id:
              type: string
              format: uuid
              example: idty_abc123
              description: the identity id to associate with this document (one of business id or identity id is required)
            metadata:
              type: object
              description: any useful information you'd like to store alongside this document
              example: { "my_id": "123" }
          required: [file_name, file_type, document_type]

  responses:
    '201':
      description: Document was created and presigned successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/Envelope.yaml
              - properties:
                  type:
                    example: document
                  data:
                    $ref: ../components/schemas/Document.yaml

get:
  summary: List Documents
  description: List the documents you have uploaded. This endpoint supports [pagination](https://docs.justifi.tech/api-spec#section/Pagination).
  operationId: ListDocuments
  tags:
    - Document
  parameters:
    - $ref: ../components/parameters/authorization-header.yaml
  responses:
    '200':
      description: Successfully list documents
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/Envelope-list.yaml
              - properties:
                  type:
                    example: array
                  data:
                    items:
                      $ref: ../components/schemas/Document.yaml
