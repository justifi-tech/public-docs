get:
  summary: Get a Payment Method Import
  description: |
    Get a payment method import, including the payment methods it tokenized.
  operationId: GetPaymentMethodImport
  tags:
    - Payment Method Imports
  parameters:
    - $ref: ../components/parameters/authorization-header.yaml
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successfully get a payment method import
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/Envelope.yaml
              - properties:
                  type:
                    example: payment_method_import
                  data:
                    $ref: ../components/schemas/PaymentMethodImportResponse.yaml
